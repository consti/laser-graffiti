<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laser Graffiti — Projector</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.live { cursor: none; }
  #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #888;
    font: 16px/1.6 -apple-system, system-ui, sans-serif; text-align: center; pointer-events: none; }
  #hint.hidden { display: none; }
  #hint b { color: #ddd; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">
  <div><b>Projector window</b><br>Drag this window onto the projector, then press <b>F</b> (or double-click) for fullscreen.<br>
  <span style="opacity:.6">Waiting for the control window…</span></div>
</div>
<script type="module" src="projector.js"></script>
</body>
</html>
